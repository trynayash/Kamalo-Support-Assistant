openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: conversations
    description: KAMALO AI conversations
  - name: assistant
    description: Grounded KAMALO AI responses
  - name: feedback
    description: Response feedback
  - name: tickets
    description: Customer support tickets and resolutions
  - name: knowledge
    description: Approved KAMALO knowledge management
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /conversations:
    get:
      operationId: listConversations
      tags: [conversations]
      summary: List conversations
      responses:
        "200":
          description: Conversation summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConversationSummary"
    post:
      operationId: createConversation
      tags: [conversations]
      summary: Create a conversation
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationInput"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
  /conversations/{conversationId}:
    get:
      operationId: getConversation
      tags: [conversations]
      summary: Get a conversation with messages
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          description: Conversation detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationDetail"
        "404":
          description: Conversation not found
    delete:
      operationId: deleteConversation
      tags: [conversations]
      summary: Delete a conversation
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "204":
          description: Conversation deleted
        "404":
          description: Conversation not found
  /conversations/{conversationId}/messages:
    post:
      operationId: streamAssistantMessage
      tags: [assistant]
      summary: Stream a grounded KAMALO AI response
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "200":
          description: Server-sent events containing response chunks
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          description: Invalid message
        "404":
          description: Conversation not found
  /conversations/{conversationId}/attachments:
    post:
      operationId: uploadConversationImage
      tags: [conversations]
      summary: Upload a JPG or PNG conversation image
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
                $ref: "#/components/schemas/ImageUploadInput"
      responses:
        "201":
          description: Uploaded conversation image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageAttachment"
        "400":
          description: Invalid image
        "413":
          description: Image is too large
  /conversations/{conversationId}/attachments/{attachmentId}:
    get:
      operationId: getConversationImage
      tags: [conversations]
      summary: Get a conversation image
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - name: attachmentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Conversation image
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        "404":
          description: Image not found
  /messages/{messageId}/feedback:
    post:
      operationId: createMessageFeedback
      tags: [feedback]
      summary: Rate an assistant response
      parameters:
        - $ref: "#/components/parameters/MessageId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackInput"
      responses:
        "201":
          description: Saved feedback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageFeedback"
        "404":
          description: Message not found
  /tickets:
    get:
      operationId: listMySupportTickets
      tags: [tickets]
      summary: List support tickets for the current demo user
      responses:
        "200":
          description: Support tickets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SupportTicket"
    post:
      operationId: createSupportTicket
      tags: [tickets]
      summary: Create a support ticket from an answer or conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportTicketInput"
      responses:
        "201":
          description: Created support ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportTicket"
        "400":
          description: Invalid ticket details
        "404":
          description: Conversation or message not found
  /tickets/admin:
    get:
      operationId: listSupportTickets
      tags: [tickets]
      summary: List support tickets for the test admin workspace
      responses:
        "200":
          description: Support tickets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SupportTicket"
  /tickets/{ticketId}:
    get:
      operationId: getSupportTicket
      tags: [tickets]
      summary: Get a support ticket
      parameters:
        - $ref: "#/components/parameters/TicketId"
      responses:
        "200":
          description: Support ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportTicket"
        "404":
          description: Ticket not found
    patch:
      operationId: updateSupportTicket
      tags: [tickets]
      summary: Update a support ticket from the test admin workspace
      parameters:
        - $ref: "#/components/parameters/TicketId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportTicketUpdate"
      responses:
        "200":
          description: Updated support ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportTicket"
        "400":
          description: Invalid ticket update
        "404":
          description: Ticket not found
  /tickets/{ticketId}/analyze:
    post:
      operationId: analyzeSupportTicket
      tags: [tickets]
      summary: Analyze a support ticket with AI or route it to a human
      parameters:
        - $ref: "#/components/parameters/TicketId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportTicketAnalysisInput"
      responses:
        "200":
          description: Analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportTicketAnalysis"
        "400":
          description: Invalid analysis request
        "404":
          description: Ticket not found
  /tickets/{ticketId}/email:
    post:
      operationId: retrySupportTicketEmail
      tags: [tickets]
      summary: Retry the latest customer support email
      parameters:
        - $ref: "#/components/parameters/TicketId"
      responses:
        "200":
          description: Ticket with the latest email delivery status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportTicket"
        "400":
          description: Ticket has no customer email address
        "404":
          description: Ticket not found
  /knowledge/articles:
    get:
      operationId: listKnowledgeArticles
      tags: [knowledge]
      summary: Search knowledge articles
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, approved, archived]
      responses:
        "200":
          description: Knowledge articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KnowledgeArticle"
    post:
      operationId: createKnowledgeArticle
      tags: [knowledge]
      summary: Create a knowledge article
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeArticleInput"
      responses:
        "201":
          description: Created article
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeArticle"
  /knowledge/articles/{articleId}:
    patch:
      operationId: updateKnowledgeArticle
      tags: [knowledge]
      summary: Update a knowledge article
      parameters:
        - $ref: "#/components/parameters/ArticleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeArticleUpdate"
      responses:
        "200":
          description: Updated article
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeArticle"
        "404":
          description: Article not found
  /knowledge/articles/{articleId}/approve:
    post:
      operationId: approveKnowledgeArticle
      tags: [knowledge]
      summary: Approve a knowledge article
      parameters:
        - $ref: "#/components/parameters/ArticleId"
      responses:
        "200":
          description: Approved article
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeArticle"
        "404":
          description: Article not found
  /knowledge/articles/{articleId}/archive:
    post:
      operationId: archiveKnowledgeArticle
      tags: [knowledge]
      summary: Archive a knowledge article
      parameters:
        - $ref: "#/components/parameters/ArticleId"
      responses:
        "200":
          description: Archived article
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeArticle"
        "404":
          description: Article not found
components:
  parameters:
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        type: string
    MessageId:
      name: messageId
      in: path
      required: true
      schema:
        type: string
    ArticleId:
      name: articleId
      in: path
      required: true
      schema:
        type: string
    TicketId:
      name: ticketId
      in: path
      required: true
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ConversationSummary:
      type: object
      required: [id, title, createdAt, updatedAt, messageCount]
      properties:
        id:
          type: string
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        messageCount:
          type: integer
    Conversation:
      type: object
      required: [id, title, createdAt, updatedAt]
      properties:
        id:
          type: string
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ConversationDetail:
      allOf:
        - $ref: "#/components/schemas/Conversation"
        - type: object
          required: [messages]
          properties:
            messages:
              type: array
              items:
                $ref: "#/components/schemas/ChatMessage"
    ChatMessage:
      type: object
      required: [id, conversationId, role, content, createdAt, attachments]
      properties:
        id:
          type: string
        conversationId:
          type: string
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        createdAt:
          type: string
          format: date-time
        feedback:
          type: ["string", "null"]
          enum: [helpful, not_helpful, null]
        attachments:
          type: array
          maxItems: 1
          items:
            $ref: "#/components/schemas/ImageAttachment"
    ConversationInput:
      type: object
      properties:
        title:
          type: string
          maxLength: 120
    MessageInput:
      type: object
      properties:
        content:
          type: string
          maxLength: 4000
        attachmentId:
          type: ["string", "null"]
          maxLength: 120
    ImageUploadInput:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
    ImageAttachment:
      type: object
      required: [id, filename, mediaType, size, url, uploadedAt]
      properties:
        id:
          type: string
        filename:
          type: string
          maxLength: 255
        mediaType:
          type: string
          enum: [image/jpeg, image/png]
        size:
          type: integer
          minimum: 1
        url:
          type: string
        uploadedAt:
          type: string
          format: date-time
    FeedbackInput:
      type: object
      required: [rating]
      properties:
        rating:
          type: string
          enum: [helpful, not_helpful]
        feedback:
          type: ["string", "null"]
          maxLength: 1000
        score:
          type: integer
          minimum: 1
          maximum: 5
          nullable: true
    MessageFeedback:
      type: object
      required: [id, messageId, rating, feedback, createdAt]
      properties:
        id:
          type: string
        messageId:
          type: string
        rating:
          type: string
          enum: [helpful, not_helpful]
        score:
          type: integer
          minimum: 1
          maximum: 5
          nullable: true
        feedback:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
    SupportTicket:
      type: object
      required: [id, ticketNumber, conversationId, category, summary, details, status, priority, emailStatus, createdAt, updatedAt, attachmentIds]
      properties:
        id:
          type: string
        ticketNumber:
          type: string
        conversationId:
          type: string
        messageId:
          type: ["string", "null"]
        category:
          type: string
        summary:
          type: string
        details:
          type: string
        contactEmail:
          type: ["string", "null"]
          format: email
        feedbackRating:
          type: ["string", "null"]
          enum: [helpful, not_helpful, null]
        status:
          type: string
          enum: [open, in_review, resolved, closed]
        priority:
          type: string
          enum: [low, normal, high, urgent]
        assignedTo:
          type: ["string", "null"]
        resolution:
          type: ["string", "null"]
        resolutionSource:
          type: ["string", "null"]
          enum: [human, ai, null]
        emailStatus:
          type: string
          enum: [not_sent, sent, failed, skipped]
        attachmentIds:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        resolvedAt:
          type: ["string", "null"]
          format: date-time
    SupportTicketInput:
      type: object
      required: [conversationId, category, summary, details]
      properties:
        conversationId:
          type: string
        messageId:
          type: ["string", "null"]
        category:
          type: string
          minLength: 2
          maxLength: 80
        summary:
          type: string
          minLength: 3
          maxLength: 180
        details:
          type: string
          minLength: 3
          maxLength: 4000
        contactEmail:
          type: ["string", "null"]
          format: email
        feedbackRating:
          type: ["string", "null"]
          enum: [helpful, not_helpful, null]
        attachmentIds:
          type: array
          maxItems: 10
          items:
            type: string
    SupportTicketUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [open, in_review, resolved, closed]
        assignedTo:
          type: ["string", "null"]
          maxLength: 120
        resolution:
          type: ["string", "null"]
          maxLength: 4000
        resolutionSource:
          type: ["string", "null"]
          enum: [human, ai, null]
    SupportTicketAnalysisInput:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [human, ai]
    SupportTicketAnalysis:
      type: object
      required: [mode, draftResolution]
      properties:
        mode:
          type: string
          enum: [human, ai]
        draftResolution:
          type: string
    KnowledgeArticle:
      type: object
      required: [id, title, category, content, version, status, createdAt, updatedAt]
      properties:
        id:
          type: string
        title:
          type: string
        category:
          type: string
        content:
          type: string
        version:
          type: integer
        status:
          type: string
          enum: [draft, approved, archived]
        effectiveFrom:
          type: ["string", "null"]
          format: date-time
        effectiveUntil:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    KnowledgeArticleInput:
      type: object
      required: [title, category, content]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 180
        category:
          type: string
          minLength: 1
          maxLength: 60
        content:
          type: string
          minLength: 1
          maxLength: 20000
        status:
          type: string
          enum: [draft, approved]
    KnowledgeArticleUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 180
        category:
          type: string
          minLength: 1
          maxLength: 60
        content:
          type: string
          minLength: 1
          maxLength: 20000

