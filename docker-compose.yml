services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: kamalo
      POSTGRES_PASSWORD: kamalo
      POSTGRES_DB: kamalo
    volumes:
      - kamalo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kamalo -d kamalo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kamalo_postgres_data:
