kind = "web"
previewPath = "/"
title = "KAMALO AI"
description = "A premium KAMALO support assistant that answers product questions from approved knowledge, with grounded conversations, history, feedback, and a future-ready support architecture."
version = "1.0.0"
id = "artifacts/kamalo-ai"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18797

[services.development]
run = "pnpm --filter @workspace/kamalo-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/kamalo-ai", "run", "build" ]
serve = "static"
publicDir = "artifacts/kamalo-ai/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18797"
BASE_PATH = "/"
